server {
    listen 8080;
    server_tokens off;

    # Docker's DNS, asked again at request time: a literal host in proxy_pass is resolved
    # once at startup, so nginx would keep the old address when a container is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream http://api:8000;
    set $minio_upstream http://minio:9000;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Only public API routes are proxied, so the API's /internal/ paths stay unreachable.
    location /api/ {
        proxy_pass $api_upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location = /docs {
        proxy_pass $api_upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location = /openapi.json {
        proxy_pass $api_upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # Presigned POST target. The exact path is the bucket's own, so there's no rewrite.
    location = /uploads/ {
        limit_except POST {
            deny all;
        }
        # A query string would select some other S3 API on the bucket.
        if ($args != "") {
            return 400;
        }
        # Storage enforces the real limit (2 GB); this one leaves room for the form fields.
        client_max_body_size 2049m;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        # MinIO answers only after the whole file is in, then finalizes it.
        proxy_read_timeout 300s;
        proxy_pass $minio_upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # Objects are never read back through this path.
    location /uploads/ {
        return 403;
    }

    # The strict shape is the path traversal defense: only these captures build the upstream
    # path. A missing or malformed token falls through to the 403 below.
    location ~ "^/hls/(?<media_exp>[0-9]{1,12})\.(?<media_sig>[0-9a-f]{64})/(?<media_id>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/(?<media_file>master\.m3u8|(?:360p|720p)/(?:index\.m3u8|seg_[0-9]{5}\.ts))$" {
        set $media_scope hls;
        include /etc/nginx/conf.d/media_proxy.inc;
        proxy_pass $minio_upstream/media/hls/$media_id/$media_file;
    }

    location /hls/ {
        access_log off;
        return 403;
    }

    # An exact match on purpose: a regex location here would overwrite the captures above.
    location = /_playback_auth {
        internal;
        access_log off;
        proxy_pass $api_upstream/internal/playback-auth;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Media-Scope $media_scope;
        proxy_set_header X-Media-Id $media_id;
        proxy_set_header X-Media-Exp $media_exp;
        proxy_set_header X-Media-Sig $media_sig;
    }

    # 403 stays 403: these pages also catch auth_request's refusal, which must not become a 404.
    location @media_denied {
        return 403;
    }

    location @media_unavailable {
        return 502;
    }

    # Refused outright, rather than answered by the site's catch-all page.
    location /internal/ {
        return 404;
    }

    # Placeholder until the SPA is added in step 14.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
