include /etc/nginx/conf.d/rate_limits.inc;

server {
    listen 8080;
    server_tokens off;
    include /etc/nginx/conf.d/security_headers.inc;
    # The API's own error shape, so the site can show the message.
    error_page 429 = @rate_limited;

    # Docker's DNS, asked again at request time: a literal host in proxy_pass is resolved
    # once at startup, so nginx would keep the old address when a container is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream http://api:8000;
    set $minio_upstream http://minio:9000;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Only public API routes are proxied, so the API's /internal/ paths stay unreachable.
    location /api/ {
        proxy_pass $api_upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # Brute force and spam (D58): the same proxy, with a limit per client IP.
    location = /api/auth/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass $api_upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location = /api/auth/register {
        limit_req zone=register burst=5 nodelay;
        proxy_pass $api_upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location = /api/videos {
        limit_req zone=uploads burst=5 nodelay;
        proxy_pass $api_upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location ~ "^/api/videos/[^/]+/(comments|reports)$" {
        limit_req zone=writes burst=10 nodelay;
        proxy_pass $api_upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location ~ "^/api/videos/[^/]+/view$" {
        limit_req zone=views burst=20 nodelay;
        proxy_pass $api_upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location = /docs {
        proxy_pass $api_upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # Answered here, or the site's catch-all would return its page with a 200.
    location = /redoc {
        return 404;
    }

    location /docs/ {
        return 404;
    }

    location = /openapi.json {
        proxy_pass $api_upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # Presigned POST target. The exact path is the bucket's own, so there's no rewrite.
    location = /uploads/ {
        limit_except POST {
            deny all;
        }
        limit_req zone=uploads burst=5 nodelay;
        # A query string would select some other S3 API on the bucket.
        if ($args != "") {
            return 400;
        }
        # Storage enforces the real limit (2 GB); this one leaves room for the form fields.
        client_max_body_size 2049m;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        # MinIO answers only after the whole file is in, then finalizes it.
        proxy_read_timeout 300s;
        proxy_pass $minio_upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # Objects are never read back through this path.
    location /uploads/ {
        return 403;
    }

    # The strict shape is the path traversal defense: only these captures build the upstream
    # path. A missing or malformed token falls through to the 403 below.
    location ~ "^/hls/(?<media_exp>[0-9]{1,12})\.(?<media_sig>[0-9a-f]{64})/(?<media_id>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/(?<media_file>master\.m3u8|(?:360p|720p)/(?:index\.m3u8|seg_[0-9]{5}\.ts))$" {
        set $media_scope hls;
        include /etc/nginx/conf.d/media_proxy.inc;
        proxy_pass $minio_upstream/media/hls/$media_id/$media_file;
    }

    location /hls/ {
        access_log off;
        return 403;
    }

    location ~ "^/thumbs/(?<media_exp>[0-9]{1,12})\.(?<media_sig>[0-9a-f]{64})/(?<media_id>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\.jpg$" {
        set $media_scope thumb;
        include /etc/nginx/conf.d/media_proxy.inc;
        # Not `always`: a refusal must not be cached.
        add_header Cache-Control "private, max-age=3600";
        proxy_pass $minio_upstream/media/thumbs/$media_id.jpg;
    }

    location /thumbs/ {
        access_log off;
        return 403;
    }

    # An exact match on purpose: a regex location here would overwrite the captures above.
    location = /_playback_auth {
        internal;
        access_log off;
        proxy_pass $api_upstream/internal/playback-auth;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Media-Scope $media_scope;
        proxy_set_header X-Media-Id $media_id;
        proxy_set_header X-Media-Exp $media_exp;
        proxy_set_header X-Media-Sig $media_sig;
    }

    # 403 stays 403: these pages also catch auth_request's refusal, which must not become a 404.
    location @media_denied {
        return 403;
    }

    location @media_unavailable {
        return 502;
    }

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        include /etc/nginx/conf.d/security_headers.inc;
        return 429 '{"detail":"Too many requests. Please wait a minute and try again."}';
    }

    # Refused outright, rather than answered by the site's catch-all page.
    location /internal/ {
        return 404;
    }

    # The site: the built SPA in the image, or Vite in the dev stack.
    include /etc/nginx/spa/location.inc;
}
