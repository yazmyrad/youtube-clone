server {
    listen 8080;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Only public API routes are proxied, so the API's /internal/ paths stay unreachable.
    location /api/ {
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location = /docs {
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location = /openapi.json {
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # Placeholder until the SPA is added in step 14.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
