[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-clone-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=25.1",
    "asyncpg>=0.30",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # import order
    "B",     # likely bugs
    "UP",    # modern syntax
    "ASYNC", # blocking calls in async code
    "S",     # security
    "C4",    # comprehensions
    "SIM",   # simplifications
    "RUF",   # ruff-specific checks
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and throwaway credentials by design.
"tests/**" = ["S101", "S105", "S106"]
# Generated migrations keep Alembic's long op lines and template imports.
"alembic/versions/**" = ["E501", "F401", "W291"]

[tool.ruff.lint.isort]
# backend/alembic/ holds migrations; without this, ruff mistakes the package for local code.
known-third-party = ["alembic"]
