name: youtube-clone

# Secrets come from .env, generated by install.sh. Only nginx publishes a port.
# `backend` has no route to the outside; nginx bridges it to `edge`.

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

x-backend-env: &backend-env
  DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:?run ./install.sh}:${POSTGRES_PASSWORD:?run ./install.sh}@postgres:5432/${POSTGRES_DB:?run ./install.sh}"
  JWT_SECRET: "${JWT_SECRET:?run ./install.sh}"
  # Off in IP-only (plain HTTP) mode, where a Secure cookie would never be sent back.
  COOKIE_SECURE: "${COOKIE_SECURE:-false}"

services:
  nginx:
    <<: *hardening
    build: infra/nginx
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:8080"
    networks:
      - edge
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: applies migrations before the API starts.
  migrate:
    <<: *hardening
    restart: "no"
    build: backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

  api:
    <<: *hardening
    build: backend
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  postgres:
    <<: *hardening
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?run ./install.sh}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?run ./install.sh}"
      POSTGRES_DB: "${POSTGRES_DB:?run ./install.sh}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

  # Upstream MinIO images are no longer published; pgsty/minio is a maintained fork with the
  # same server and `mc`. Pinned by digest, so a re-tagged image can't slip in.
  minio:
    <<: *hardening
    image: &minio-image pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?run ./install.sh}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?run ./install.sh}"
      MINIO_BROWSER: "off"
    volumes:
      - minio-data:/data
    networks:
      - storage
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: buckets, anonymous read policy and the scoped app user. The only service
  # with the MinIO root credentials.
  storage-init:
    <<: *hardening
    restart: "no"
    build:
      context: infra/minio
      args:
        MINIO_IMAGE: *minio-image
    entrypoint: ["sh", "/init/init.sh"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?run ./install.sh}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?run ./install.sh}"
      MINIO_APP_ACCESS_KEY: "${MINIO_APP_ACCESS_KEY:?run ./install.sh}"
      MINIO_APP_SECRET_KEY: "${MINIO_APP_SECRET_KEY:?run ./install.sh}"
      HOME: /tmp
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - storage
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

networks:
  edge:
  backend:
    internal: true
  # MinIO and the services that talk to it (api, worker, nginx join as their steps land).
  storage:
    internal: true

volumes:
  postgres-data:
  minio-data:
