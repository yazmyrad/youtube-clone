name: youtube-clone

# Secrets come from .env, generated by install.sh. Only nginx publishes a port.
# `backend` has no route to the outside; nginx bridges it to `edge`.

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

x-backend-env: &backend-env
  DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:?run ./install.sh}:${POSTGRES_PASSWORD:?run ./install.sh}@postgres:5432/${POSTGRES_DB:?run ./install.sh}"

services:
  nginx:
    <<: *hardening
    build: infra/nginx
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:8080"
    networks:
      - edge
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: applies migrations before the API starts.
  migrate:
    <<: *hardening
    restart: "no"
    build: backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

  api:
    <<: *hardening
    build: backend
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  postgres:
    <<: *hardening
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?run ./install.sh}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?run ./install.sh}"
      POSTGRES_DB: "${POSTGRES_DB:?run ./install.sh}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres-data:
