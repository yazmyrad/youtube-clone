# Development overrides, used only through the Makefile (`make dev`).
# A separate project (youtube-clone-dev) and .env.dev keep dev data away from a real deploy.

services:
  api:
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --proxy-headers
      - --forwarded-allow-ips=*
      - --reload
      - --reload-dir=app
    volumes:
      - ./backend/app:/srv/app:ro

  worker:
    command: ["watchfiles", "--filter", "python", "python -m app.workers.main", "app"]
    volumes:
      - ./backend/app:/srv/app:ro

  seed:
    volumes:
      - ./backend/app:/srv/app:ro

  migrate:
    volumes:
      - ./backend/app:/srv/app:ro
      - ./backend/alembic:/srv/alembic:ro
      - ./backend/alembic.ini:/srv/alembic.ini:ro

  # Hot reload for the site, reached through nginx. Publishes no port.
  frontend:
    image: node:22.22.1-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "npm ci --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 5173 --strictPort"]
    volumes:
      - ./frontend:/app
      # Its own copy: packages built for this image's libc must not replace the host's.
      - frontend-node-modules:/app/node_modules
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 180s

  nginx:
    # The config stage only: this stack doesn't need the production site built.
    build:
      target: nginx-base
    # Replaces the deploy's port, so the dev site is reachable from this machine only.
    ports: !override
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    volumes:
      # The directory, not single files: a file mount stays on the old inode when git or an
      # editor replaces the file. nginx only includes conf.d/*.conf, so the rest is ignored.
      - ./infra/nginx:/etc/nginx/conf.d:ro
      - ./infra/nginx/spa-dev:/etc/nginx/spa:ro

  postgres:
    # Reachable from the host for migrations, tests and database tools, on localhost only.
    # Docker can't publish ports on an internal network, so this adds a regular one.
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-55432}:5432"
    networks:
      - backend
      - dev-host
    volumes:
      - ./infra/postgres/dev-init:/docker-entrypoint-initdb.d:ro

  minio:
    # Reachable from the host for tests, on localhost only (see postgres above).
    ports:
      - "127.0.0.1:${DEV_MINIO_PORT:-59000}:9000"
    networks:
      - storage
      - dev-host

networks:
  dev-host:

volumes:
  frontend-node-modules:
